<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masa Demo BundaCare Habis</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff4d4d,#c70039);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:#fff;
    max-width:500px;
    width:100%;
    text-align:center;
    padding:40px 30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.stop-icon{
    width:150px;
    margin-bottom:20px;
}

h1{
    color:#d60000;
    margin-bottom:15px;
    font-size:30px;
}

p{
    color:#555;
    line-height:1.8;
    margin-bottom:25px;
    font-size:17px;
}

.btn{
    display:inline-block;
    background:#d60000;
    color:#fff;
    text-decoration:none;
    padding:14px 30px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#b30000;
    transform:translateY(-2px);
}

.footer{
    margin-top:20px;
    color:#888;
    font-size:13px;
}
</style>
</head>
<body>

<div class="container">

    <img
    class="stop-icon"
    src="https://cdn-icons-png.flaticon.com/512/564/564619.png"
    alt="STOP">

    <h1>MASA DEMO HABIS</h1>

    <p>
        Masa demo aplikasi <strong>BundaCare</strong> telah berakhir.
        Untuk terus menggunakan seluruh fitur aplikasi,
        silakan melakukan pembelian lisensi resmi melalui
        <strong>Bejaja Digital</strong>.
    </p>

    <a href="https://bejajadigital.id" class="btn">
        Beli Sekarang
    </a>

    <div class="footer">
        © 2026 Bejaja Digital. All Rights Reserved.
    </div>

</div>

</body>
</html>
